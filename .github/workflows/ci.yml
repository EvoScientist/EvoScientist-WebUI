name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # allow manual runs from the GitHub UI

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Format, lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # `npm ci` does a clean, reproducible install from package-lock.json
      # and fails on lockfile drift.
      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # The server routes that read and write this machine's files (skills,
  # workspace, projects, settings, AutoSkills) and their helpers, on Windows:
  # its paths, links and file locking differ, and the rest of the WebUI's
  # tests run on Linux only.
  server-windows:
    name: Server-side tests (windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server-side unit tests
        run: npx vitest run src/app/api src/lib/server

  desktop:
    name: Desktop lint & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows runs in desktop.yml, with the build and the smoke test.
        # macOS runs here too: the tests of the process tree, the process
        # groups and the login shell are skipped on Windows.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # A hung test blocks no one for hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      # Electron's Node is 24; the desktop code is checked against the same.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # Installs no Electron binary (Electron 44 has no postinstall); the
      # unit tests do not start Electron. Packaging is in desktop.yml.
      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      # The build bundles the core's install scripts from the tag of the
      # version it installs; a missing tag or file fails here, not at release.
      - name: Download the core's install scripts
        run: npm run fetch-core-scripts

      - name: Unit tests
        run: npm test
